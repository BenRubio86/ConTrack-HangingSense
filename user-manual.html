acy',privacyD:'ConTrack is local/offline-first. No account or cloud sync is required. Recorded data does not diagnose labour.',kpiTitle:'KPI definitions',kpiNote:'The same definitions are used in Track, History, Summary and reports.',kDuration:'Duration',duration:'Time from the start of a contraction to its end.',kInterval:'Interval',interval:'Time from the start of one contraction to the start of the next.',kAvgD:'Avg duration · last 5',avgD:'Mean of the latest up to five contraction durations; with fewer than five, all available durations are used.',kAvgI:'Avg interval · last 5',avgI:'Mean of the latest up to five valid start-to-start intervals; with fewer than five, all available intervals are used.',kPain:'Pain intensity',painK:'Optional subjective value from 0 to 10, shown as entered and not interpreted diagnostically.',contactTitle:'Contact Hanging Sense',brandFooterTitle:'Brand & creator',creatorText:'BenYimaAI · App creator · product concept, UX direction and application development.',legal:'ConTrack records user-entered timing and observations. It does not diagnose labour or replace professional medical advice.'};

es:{title:'Manual de ConTrack',intro:'Guía breve para cronometrar contracciones, registrar eventos, comprender KPI y gráficos, gestionar fotos, compartir informes y proteger los datos.',functionsTitle:'Cómo funciona ConTrack',functionsNote:'Cada función está pensada para un uso rápido en el teléfono.',quickFunctions:'Funciones',quickContact:'Contacto',track:'Seguimiento / temporizador',trackD:'Toca INICIAR al comenzar y DETENER al finalizar. El ritmo reciente muestra hasta cinco contracciones con duración y dolor; Editar corrige el último registro.',pain:'Intensidad del dolor',painD:'Después de DETENER usa el control 0–10. Es opcional, subjetivo y editable.',events:'Eventos y fotos',eventsD:'Registra orina, dolor/molestia, aguas/líquido, sangrado u otro evento. Nota y foto son opcionales y permanecen locales hasta compartir o exportar.',history:'Historial',historyD:'El historial combina contracciones y eventos. La primera fila muestra hora y KPI; la segunda, medias móviles, notas, foto y Editar.',summary:'Gráfico resumen',summaryD:'El gráfico combina duración, intervalo inicio-a-inicio, dolor y eventos. Selecciona 1 h, 3 h, Día o Todo; el eje X se adapta.',trend:'Tendencia móvil de 5 valores',trendD:'El segundo gráfico muestra promedios móviles de duración e intervalo; antes de cinco valores usa todos los disponibles.',reports:'Compartir y exportar',reportsD:'Compartir crea un HTML con el tema e idioma seleccionados. Descargar ofrece PNG o HTML con gráficos, cronología, fotos, marca y creador.',sessions:'Sesiones y copia de seguridad',sessionsD:'Antes de una nueva sesión, ConTrack ofrece copia o archivo. La copia incluye también las fotos locales.',themes:'Temas e idioma',themesD:'Seis temas cambian superficies, tipografía, gráficos e informes. El idioma actualiza también este manual.',privacy:'Privacidad',privacyD:'ConTrack es local y offline por defecto. No requiere cuenta ni nube; los registros no diagnostican el parto.',kpiTitle:'Definiciones KPI',kpiNote:'Las mismas definiciones se usan en Seguimiento, Historial, Resumen e informes.',kDuration:'Duración',duration:'Tiempo desde el inicio hasta el final de una contracción.',kInterval:'Intervalo',interval:'Tiempo desde el inicio de una contracción hasta el inicio de la siguiente.',kAvgD:'Duración media · últimas 5',avgD:'Media de hasta las cinco duraciones más recientes; si hay menos, se usan todas.',kAvgI:'Intervalo medio · últimos 5',avgI:'Media de hasta los cinco intervalos válidos más recientes; si hay menos, se usan todos.',kPain:'Intensidad del dolor',painK:'Valor subjetivo opcional de 0 a 10, mostrado tal como se registró y sin interpretación diagnóstica.',contactTitle:'Contacto Hanging Sense',brandFooterTitle:'Marca y creador',creatorText:'BenYimaAI · Creador de la app · concepto de producto, dirección UX y desarrollo.',legal:'ConTrack registra tiempos y observaciones del usuario. No diagnostica el parto ni sustituye el asesoramiento médico profesional.'},
zh:{title:'ConTrack 使用说明',intro:'简明介绍如何记录宫缩和事件、理解 KPI 与图表、管理照片、分享报告以及保护会话数据。',functionsTitle:'ConTrack 的使用方式',functionsNote:'所有功能均针对手机上的快速操作进行了优化。',quickFunctions:'功能',quickContact:'联系',track:'记录 / 宫缩计时',trackD:'宫缩开始时点“开始”，结束时点“停止”。最近节律显示最多 5 次宫缩的持续时间和疼痛强度，并可编辑最新记录。',pain:'疼痛强度',painD:'停止后使用 0–10 滑块记录强度。该值可选、主观，并可稍后修改。',events:'事件和照片',eventsD:'记录排尿、疼痛/不适、羊水/液体、出血或其他事件，并可添加备注和照片。照片在主动分享或导出前保留在本机。',history:'历史记录',historyD:'历史记录将宫缩和事件合并在同一时间线中。第一行显示时间和 KPI，第二行显示滚动平均、备注、照片和编辑。',summary:'汇总图表',summaryD:'综合图表显示持续时间、开始到开始间隔、疼痛强度和事件。可选择 1 小时、3 小时、当天或全部，X 轴自动适配。',trend:'最近 5 个值滚动趋势',trendD:'第二张图显示持续时间和间隔的滚动平均；不足 5 个值时使用全部已有值。',reports:'分享和导出',reportsD:'分享会生成与当前主题和语言一致的 HTML 报告。下载可选 PNG 或 HTML，包含图表、时间线、照片、品牌和 Creator 信息。',sessions:'会话和备份',sessionsD:'开始新会话前可选择备份或应用内归档。备份也包含本地事件照片。',themes:'主题和语言',themesD:'六种主题会改变界面、字体强调、图表和报告。切换语言也会更新本说明。',privacy:'隐私',privacyD:'ConTrack 默认本地、离线优先，无需账户或云同步。记录数据不能用于诊断分娩。',kpiTitle:'KPI 定义',kpiNote:'记录、历史、汇总和报告都使用相同定义。',kDuration:'持续时间',duration:'从一次宫缩开始到结束的时间。',kInterval:'间隔',interval:'从一次宫缩开始到下一次宫缩开始的时间。',kAvgD:'平均持续时间 · 最近5次',avgD:'最多取最近 5 次持续时间的平均值；不足 5 次时使用全部已有值。',kAvgI:'平均间隔 · 最近5个',avgI:'最多取最近 5 个有效开始间隔的平均值；不足 5 个时使用全部已有值。',kPain:'疼痛强度',painK:'可选的 0–10 主观评分，仅按记录显示，不进行诊断解释。',contactTitle:'联系 Hanging Sense',brandFooterTitle:'品牌与 Creator',creatorText:'BenYimaAI · App Creator · 产品概念、UX 方向与应用开发。',legal:'ConTrack 仅记录用户输入的时间和观察信息，不诊断分娩，也不能替代专业医疗建议。'},
ru:{title:'Инструкция ConTrack',intro:'Краткое руководство по схваткам, событиям, KPI, графикам, фотографиям, отчётам и защите данных сессии.',functionsTitle:'Как работает ConTrack',functionsNote:'Все функции рассчитаны на быстрое использование на телефоне.',quickFunctions:'Функции',quickContact:'Контакты',track:'Трекер схваток',trackD:'Нажмите СТАРТ в начале и СТОП в конце. Последний ритм показывает до пяти схваток с длительностью и болью; Изменить исправляет последнюю запись.',pain:'Интенсивность боли',painD:'После СТОП используйте ползунок 0–10. Оценка субъективна, необязательна и редактируется.',events:'События и фото',eventsD:'Записывайте мочеиспускание, боль, воды, кровотечение или другое событие. Заметка и фото необязательны и остаются локальными до экспорта.',history:'История',historyD:'История объединяет схватки и события. Первая строка показывает время и KPI, вторая — скользящие средние, заметки, фото и Изменить.',summary:'Сводный график',summaryD:'График показывает длительность, интервал начало-начало, боль и события. Выберите 1 ч, 3 ч, День или Всё; ось X адаптируется.',trend:'Тренд последних 5 значений',trendD:'Второй график показывает скользящие средние длительности и интервала; пока значений меньше пяти, используются все доступные.',reports:'Общий доступ и экспорт',reportsD:'Общий доступ создаёт HTML в выбранной теме и языке. Скачать можно PNG или HTML с графиками, хронологией, фото, брендом и Creator.',sessions:'Сессии и резервная копия',sessionsD:'Перед новой сессией ConTrack предлагает копию или архив. Копия включает локальные фото.',themes:'Темы и язык',themesD:'Шесть тем меняют оформление, типографику, графики и отчёты. Язык также обновляет это руководство.',privacy:'Конфиденциальность',privacyD:'ConTrack работает локально и офлайн по умолчанию. Аккаунт и облако не нужны; записи не являются диагнозом.',kpiTitle:'Определения KPI',kpiNote:'Одни и те же определения используются в Трекере, Истории, Сводке и отчётах.',kDuration:'Длительность',duration:'Время от начала схватки до её окончания.',kInterval:'Интервал',interval:'Время от начала одной схватки до начала следующей.',kAvgD:'Средняя длительность · последние 5',avgD:'Среднее максимум по пяти последним длительностям; если их меньше, используются все.',kAvgI:'Средний интервал · последние 5',avgI:'Среднее максимум по пяти последним валидным интервалам; если их меньше, используются все.',kPain:'Интенсивность боли',painK:'Необязательная субъективная оценка 0–10, отображаемая как введена и без диагностической интерпретации.',contactTitle:'Контакты Hanging Sense',brandFooterTitle:'Бренд и Creator',creatorText:'BenYimaAI · Creator приложения · концепция продукта, UX и разработка.',legal:'ConTrack хранит введённые пользователем время и наблюдения. Он не диагностирует родовую деятельность и не заменяет медицинскую консультацию.'},
ja:{title:'ConTrack 取扱説明',intro:'陣痛とイベントの記録、KPI とグラフ、写真、レポート共有、セッションデータ保護を簡潔に説明します。',functionsTitle:'ConTrack の使い方',functionsNote:'すべての機能はスマートフォンで素早く使えるよう設計されています。',quickFunctions:'機能',quickContact:'連絡先',track:'記録 / 陣痛タイマー',trackD:'陣痛開始時に開始、終了時に停止をタップします。最近のリズムには最大 5 回の持続時間と痛み強度が表示され、最新記録を編集できます。',pain:'痛み強度',painD:'停止後に 0–10 スライダーで記録します。任意の主観的な値で、後から編集できます。',events:'イベントと写真',eventsD:'排尿、痛み/不快感、破水/液体、出血、その他を記録できます。メモと写真は任意で、共有・書き出し前は端末内に保存されます。',history:'履歴',historyD:'履歴は陣痛とイベントを同じタイムラインで表示します。1 行目に時刻と KPI、2 行目に移動平均、メモ、写真、編集が表示されます。',summary:'概要グラフ',summaryD:'統合グラフには持続時間、開始間隔、痛み強度、イベントが表示されます。1 時間、3 時間、当日、すべてを選択でき、X 軸は自動調整されます。',trend:'直近5値の移動トレンド',trendD:'2 つ目のグラフは持続時間と間隔の移動平均を表示します。5 値未満の場合は利用可能な全値を使用します。',reports:'共有と書き出し',reportsD:'共有では選択中のテーマと言語で HTML レポートを生成します。PNG または HTML を保存でき、グラフ、タイムライン、写真、ブランド、Creator 情報を含みます。',sessions:'セッションとバックアップ',sessionsD:'新しいセッション前にバックアップまたはアプリ内アーカイブを選べます。バックアップにはローカル写真も含まれます。',themes:'テーマと言語',themesD:'6 つのテーマが画面、文字アクセント、グラフ、レポートを変更します。言語変更はこの説明書にも反映されます。',privacy:'プライバシー',privacyD:'ConTrack はローカル・オフライン優先です。アカウントやクラウド同期は不要で、記録は診断ではありません。',kpiTitle:'KPI 定義',kpiNote:'記録、履歴、概要、レポートで同じ定義を使用します。',kDuration:'持続時間',duration:'陣痛開始から終了までの時間。',kInterval:'間隔',interval:'ある陣痛の開始から次の陣痛開始までの時間。',kAvgD:'平均持続時間 · 直近5件',avgD:'直近最大 5 件の持続時間平均。5 件未満なら利用可能な全件を使用します。',kAvgI:'平均間隔 · 直近5件',avgI:'直近最大 5 件の有効な開始間隔平均。5 件未満なら利用可能な全件を使用します。',kPain:'痛み強度',painK:'任意の主観的な 0–10 値。入力どおりに表示され、診断には使用しません。',contactTitle:'Hanging Sense 連絡先',brandFooterTitle:'ブランドと Creator',creatorText:'BenYimaAI · App Creator · プロダクトコンセプト、UX 方向性、アプリ開発。',legal:'ConTrack はユーザーが入力した時刻と観察事項を記録します。分娩を診断せず、専門的な医療助言の代わりにはなりません。'},
ko:{title:'ConTrack 사용 설명서',intro:'진통과 이벤트 기록, KPI와 차트, 사진, 보고서 공유, 세션 데이터 보호 방법을 간단히 설명합니다.',functionsTitle:'ConTrack 사용 방법',functionsNote:'모든 기능은 휴대폰에서 빠르게 사용할 수 있도록 설계되었습니다.',quickFunctions:'기능',quickContact:'연락처',track:'추적 / 진통 타이머',trackD:'진통 시작 시 시작, 끝날 때 종료를 누릅니다. 최근 리듬은 최대 5회의 지속시간과 통증 강도를 보여주며 최신 기록을 편집할 수 있습니다.',pain:'통증 강도',painD:'종료 후 0–10 슬라이더로 기록합니다. 선택 사항이며 주관적인 값으로 나중에 수정할 수 있습니다.',events:'이벤트와 사진',eventsD:'배뇨, 통증/불편감, 양수/액체, 출혈 또는 기타 이벤트를 기록하고 메모와 사진을 추가할 수 있습니다. 공유 전에는 기기에만 저장됩니다.',history:'기록',historyD:'기록 화면은 진통과 이벤트를 한 타임라인에 표시합니다. 첫 줄은 시간과 KPI, 둘째 줄은 이동 평균, 메모, 사진, 편집입니다.',summary:'요약 차트',summaryD:'통합 차트는 지속시간, 시작-시작 간격, 통증 강도, 이벤트를 함께 표시합니다. 1시간, 3시간, 오늘, 전체를 선택할 수 있고 X축은 자동 조정됩니다.',trend:'최근 5개 값 추세',trendD:'두 번째 차트는 지속시간과 간격의 이동 평균을 보여줍니다. 5개 미만이면 사용 가능한 모든 값을 사용합니다.',reports:'공유 및 내보내기',reportsD:'공유는 현재 테마와 언어로 HTML 보고서를 만듭니다. PNG 또는 HTML을 저장할 수 있으며 차트, 타임라인, 사진, 브랜드, Creator 정보를 포함합니다.',sessions:'세션과 백업',sessionsD:'새 세션 전 백업 또는 앱 내 보관을 선택할 수 있습니다. 백업에는 로컬 사진도 포함됩니다.',themes:'테마와 언어',themesD:'6개 테마가 화면, 타이포그래피, 차트, 보고서를 변경합니다. 언어 변경은 이 설명서에도 반영됩니다.',privacy:'개인정보',privacyD:'ConTrack은 로컬/오프라인 우선이며 계정이나 클라우드 동기화가 필요 없습니다. 기록은 진단이 아닙니다.',kpiTitle:'KPI 정의',kpiNote:'추적, 기록, 요약, 보고서에 같은 정의가 사용됩니다.',kDuration:'지속시간',duration:'진통 시작부터 끝까지의 시간입니다.',kInterval:'간격',interval:'한 진통 시작부터 다음 진통 시작까지의 시간입니다.',kAvgD:'평균 지속시간 · 최근 5',avgD:'최근 최대 5개의 지속시간 평균입니다. 5개 미만이면 모든 값을 사용합니다.',kAvgI:'평균 간격 · 최근 5',avgI:'최근 최대 5개의 유효한 시작 간격 평균입니다. 5개 미만이면 모든 값을 사용합니다.',kPain:'통증 강도',painK:'선택 가능한 주관적 0–10 값이며 입력 그대로 표시하고 진단적으로 해석하지 않습니다.',contactTitle:'Hanging Sense 연락처',brandFooterTitle:'브랜드 & Creator',creatorText:'BenYimaAI · App Creator · 제품 콘셉트, UX 방향, 애플리케이션 개발.',legal:'ConTrack은 사용자가 입력한 시간과 관찰 내용을 기록합니다. 진통을 진단하지 않으며 전문 의료 조언을 대신하지 않습니다.'},
ar:{title:'دليل استخدام ConTrack',intro:'دليل مختصر لتسجيل الانقباضات والأحداث وفهم KPI والرسوم وإدارة الصور ومشاركة التقارير وحماية بيانات الجلسة.',functionsTitle:'طريقة استخدام ConTrack',functionsNote:'صُممت الوظائف للاستخدام السريع على الهاتف.',quickFunctions:'الوظائف',quickContact:'الاتصال',track:'التتبع / مؤقت الانقباضات',trackD:'اضغطي بدء عند بداية الانقباض وإيقاف عند نهايته. يعرض الإيقاع الأخير حتى خمسة انقباضات مع المدة وشدة الألم ويمكن تعديل أحدث سجل.',pain:'شدة الألم',painD:'بعد الإيقاف استخدمي شريط 0–10. القيمة اختيارية وذاتية ويمكن تعديلها لاحقاً.',events:'الأحداث والصور',eventsD:'سجّلي التبول أو الألم أو نزول المياه أو النزيف أو حدثاً آخر. الملاحظة والصورة اختياريتان وتبقيان محلياً حتى المشاركة أو التصدير.',history:'السجل',historyD:'يجمع السجل الانقباضات والأحداث في خط زمني واحد. السطر الأول للوقت وKPI والثاني للمتوسطات المتحركة والملاحظات والصورة والتعديل.',summary:'مخطط الملخص',summaryD:'يجمع المخطط المدة والفاصل من بداية إلى بداية وشدة الألم والأحداث. اختاري ساعة أو 3 ساعات أو اليوم أو الكل؛ محور X يتكيف تلقائياً.',trend:'اتجاه آخر 5 قيم',trendD:'يعرض المخطط الثاني المتوسط المتحرك للمدة والفاصل. قبل توفر خمس قيم تُستخدم كل القيم المتاحة.',reports:'المشاركة والتصدير',reportsD:'تنشئ المشاركة تقرير HTML بالتصميم واللغة المختارين. يمكن تنزيل PNG أو HTML مع الرسوم والخط الزمني والصور والعلامة وCreator.',sessions:'الجلسات والنسخ الاحتياطي',sessionsD:'قبل جلسة جديدة يمكن اختيار النسخ الاحتياطي أو الأرشفة داخل التطبيق. يشمل النسخ الصور المحلية أيضاً.',themes:'التصاميم واللغة',themesD:'ستة تصاميم تغير الأسطح والطباعة والرسوم والتقارير. تغيير اللغة يحدّث هذا الدليل أيضاً.',privacy:'الخصوصية',privacyD:'يعمل ConTrack محلياً وبدون اتصال أولاً، ولا يحتاج إلى حساب أو مزامنة سحابية. السجلات ليست تشخيصاً.',kpiTitle:'تعريف KPI',kpiNote:'تُستخدم التعريفات نفسها في التتبع والسجل والملخص والتقارير.',kDuration:'المدة',duration:'الوقت من بداية الانقباض إلى نهايته.',kInterval:'الفاصل',interval:'الوقت من بداية انقباض إلى بداية الانقباض التالي.',kAvgD:'متوسط المدة · آخر 5',avgD:'متوسط آخر خمس مدد كحد أقصى؛ إذا كانت أقل تُستخدم كل القيم المتاحة.',kAvgI:'متوسط الفاصل · آخر 5',avgI:'متوسط آخر خمسة فواصل صالحة كحد أقصى؛ إذا كانت أقل تُستخدم كل القيم المتاحة.',kPain:'شدة الألم',painK:'قيمة ذاتية اختيارية من 0 إلى 10 تُعرض كما أُدخلت ولا تُفسر تشخيصياً.',contactTitle:'التواصل مع Hanging Sense',brandFooterTitle:'العلامة و Creator',creatorText:'BenYimaAI · App Creator · مفهوم المنتج وتوجيه UX وتطوير التطبيق.',legal:'يسجل ConTrack الأوقات والملاحظات التي يدخلها المستخدم. لا يشخص المخاض ولا يستبدل الاستشارة الطبية المتخصصة.'},
hi:{title:'ConTrack उपयोग निर्देश',intro:'कॉन्ट्रैक्शन और इवेंट दर्ज करने, KPI व चार्ट समझने, फोटो, रिपोर्ट और सेशन डेटा सुरक्षित रखने की संक्षिप्त गाइड।',functionsTitle:'ConTrack कैसे काम करता है',functionsNote:'सभी फीचर फोन पर तेज उपयोग के लिए बनाए गए हैं।',quickFunctions:'फीचर',quickContact:'संपर्क',track:'ट्रैक / कॉन्ट्रैक्शन टाइमर',trackD:'कॉन्ट्रैक्शन शुरू होने पर START और खत्म होने पर STOP टैप करें। हाल का रिदम अधिकतम 5 कॉन्ट्रैक्शन की अवधि और दर्द तीव्रता दिखाता है और नवीनतम रिकॉर्ड एडिट किया जा सकता है।',pain:'दर्द की तीव्रता',painD:'STOP के बाद 0–10 स्लाइडर से तीव्रता दर्ज करें। यह वैकल्पिक, व्यक्तिपरक और बाद में संपादन योग्य है।',events:'इवेंट और फोटो',eventsD:'पेशाब, दर्द/असुविधा, पानी/द्रव, रक्तस्राव या अन्य इवेंट दर्ज करें। नोट और फोटो वैकल्पिक हैं और साझा करने तक स्थानीय रहते हैं।',history:'इतिहास',historyD:'इतिहास कॉन्ट्रैक्शन और इवेंट को एक टाइमलाइन में जोड़ता है। पहली पंक्ति समय व KPI, दूसरी पंक्ति रोलिंग औसत, नोट, फोटो और एडिट दिखाती है।',summary:'सारांश चार्ट',summaryD:'यूनिफाइड चार्ट अवधि, स्टार्ट-टू-स्टार्ट अंतराल, दर्द तीव्रता और इवेंट दिखाता है। 1 घंटा, 3 घंटे, दिन या सभी चुनें; X-अक्ष स्वतः बदलता है।',trend:'अंतिम 5 मानों का ट्रेंड',trendD:'दूसरा चार्ट अवधि और अंतराल का रोलिंग औसत दिखाता है। 5 से कम मान होने पर सभी उपलब्ध मान उपयोग होते हैं।',reports:'शेयर और एक्सपोर्ट',reportsD:'शेयर वर्तमान थीम और भाषा में HTML रिपोर्ट बनाता है। PNG या HTML डाउनलोड में चार्ट, टाइमलाइन, फोटो, ब्रांड और Creator शामिल हैं।',sessions:'सेशन और बैकअप',sessionsD:'नया सेशन शुरू करने से पहले बैकअप या ऐप में आर्काइव चुन सकते हैं। बैकअप में स्थानीय फोटो भी शामिल हैं।',themes:'थीम और भाषा',themesD:'छह थीम स्क्रीन, टाइपोग्राफी, चार्ट और रिपोर्ट बदलती हैं। भाषा बदलने पर यह मैनुअल भी अपडेट होता है।',privacy:'गोपनीयता',privacyD:'ConTrack स्थानीय/ऑफलाइन-फर्स्ट है। खाते या क्लाउड सिंक की जरूरत नहीं है। रिकॉर्ड निदान नहीं करते।',kpiTitle:'KPI परिभाषाएँ',kpiNote:'ट्रैक, इतिहास, सारांश और रिपोर्ट में यही परिभाषाएँ उपयोग होती हैं।',kDuration:'अवधि',duration:'कॉन्ट्रैक्शन शुरू होने से समाप्त होने तक का समय।',kInterval:'अंतराल',interval:'एक कॉन्ट्रैक्शन के शुरू होने से अगले के शुरू होने तक का समय।',kAvgD:'औसत अवधि · अंतिम 5',avgD:'अधिकतम अंतिम 5 अवधि का औसत; कम होने पर सभी उपलब्ध अवधि उपयोग होती हैं।',kAvgI:'औसत अंतराल · अंतिम 5',avgI:'अधिकतम अंतिम 5 मान्य अंतराल का औसत; कम होने पर सभी उपलब्ध अंतराल उपयोग होते हैं।',kPain:'दर्द तीव्रता',painK:'वैकल्पिक व्यक्तिपरक 0–10 मान, जैसा दर्ज किया गया है वैसा ही दिखाया जाता है और निदान नहीं माना जाता।',contactTitle:'Hanging Sense संपर्क',brandFooterTitle:'ब्रांड और Creator',creatorText:'BenYimaAI · App Creator · प्रोडक्ट कॉन्सेप्ट, UX दिशा और एप्लिकेशन विकास।',legal:'ConTrack उपयोगकर्ता द्वारा दर्ज समय और अवलोकन रिकॉर्ड करता है। यह प्रसव का निदान नहीं करता और पेशेवर चिकित्सकीय सलाह का विकल्प नहीं है।'},
fa:{title:'راهنمای ConTrack',intro:'راهنمای کوتاه برای ثبت انقباض‌ها و رویدادها، درک KPI و نمودارها، مدیریت عکس‌ها، گزارش‌ها و داده‌های جلسه.',functionsTitle:'ConTrack چگونه کار می‌کند',functionsNote:'همه قابلیت‌ها برای استفاده سریع با تلفن طراحی شده‌اند.',quickFunctions:'قابلیت‌ها',quickContact:'تماس',track:'ردیابی / زمان‌سنج انقباض',trackD:'در شروع انقباض START و در پایان STOP را بزنید. ریتم اخیر حداکثر پنج انقباض را با مدت و شدت درد نشان می‌دهد و آخرین رکورد قابل ویرایش است.',pain:'شدت درد',painD:'پس از STOP شدت را با نوار ۰ تا ۱۰ ثبت کنید. این مقدار اختیاری، ذهنی و بعداً قابل ویرایش است.',events:'رویدادها و عکس‌ها',eventsD:'ادرار، درد/ناراحتی، آب/مایع، خونریزی یا رویداد دیگر را ثبت کنید. یادداشت و عکس اختیاری هستند و تا اشتراک یا خروجی به‌صورت محلی می‌مانند.',history:'تاریخچه',historyD:'تاریخچه انقباض‌ها و رویدادها را در یک خط زمانی ترکیب می‌کند. ردیف اول زمان و KPI و ردیف دوم میانگین متحرک، یادداشت، عکس و ویرایش را نشان می‌دهد.',summary:'نمودار خلاصه',summaryD:'نمودار یکپارچه مدت، فاصله شروع تا شروع، شدت درد و رویدادها را نشان می‌دهد. ۱ ساعت، ۳ ساعت، روز یا همه را انتخاب کنید؛ محور X خودکار تنظیم می‌شود.',trend:'روند آخرین ۵ مقدار',trendD:'نمودار دوم میانگین متحرک مدت و فاصله را نشان می‌دهد. تا قبل از پنج مقدار، همه مقادیر موجود استفاده می‌شوند.',reports:'اشتراک و خروجی',reportsD:'اشتراک یک گزارش HTML با تم و زبان انتخاب‌شده می‌سازد. دانلود PNG یا HTML شامل نمودار، خط زمانی، عکس، برند و Creator است.',sessions:'جلسه‌ها و پشتیبان',sessionsD:'قبل از جلسه جدید می‌توان پشتیبان یا آرشیو داخل برنامه را انتخاب کرد. پشتیبان شامل عکس‌های محلی نیز هست.',themes:'تم و زبان',themesD:'شش تم ظاهر، تایپوگرافی، نمودار و گزارش را تغییر می‌دهند. تغییر زبان این راهنما را نیز به‌روز می‌کند.',privacy:'حریم خصوصی',privacyD:'ConTrack محلی و آفلاین‌اول است. حساب یا همگام‌سازی ابری لازم نیست و داده‌ها تشخیص نیستند.',kpiTitle:'تعریف KPI',kpiNote:'همین تعریف‌ها در ردیابی، تاریخچه، خلاصه و گزارش‌ها استفاده می‌شوند.',kDuration:'مدت',duration:'زمان از شروع انقباض تا پایان آن.',kInterval:'فاصله',interval:'زمان از شروع یک انقباض تا شروع انقباض بعدی.',kAvgD:'میانگین مدت · آخرین ۵',avgD:'میانگین حداکثر پنج مدت اخیر؛ اگر کمتر باشد همه مقادیر موجود استفاده می‌شوند.',kAvgI:'میانگین فاصله · آخرین ۵',avgI:'میانگین حداکثر پنج فاصله معتبر اخیر؛ اگر کمتر باشد همه فاصله‌های موجود استفاده می‌شوند.',kPain:'شدت درد',painK:'مقدار ذهنی اختیاری ۰ تا ۱۰ که همان‌طور که ثبت شده نمایش داده می‌شود و تفسیر تشخیصی ندارد.',contactTitle:'تماس با Hanging Sense',brandFooterTitle:'برند و Creator',creatorText:'BenYimaAI · App Creator · مفهوم محصول، جهت UX و توسعه برنامه.',legal:'ConTrack زمان‌ها و مشاهدات واردشده را ثبت می‌کند. تشخیص زایمان نیست و جایگزین مشاوره پزشکی حرفه‌ای نمی‌شود.'}
};
const T={...EN,...(packs[lang]||{})};document.documentElement.lang=lang;document.documentElement.dir=['ar','fa'].includes(lang)?'rtl':'ltr';document.title=T.title;const $=id=>document.getElementById(id);$('title').textContent=T.title;$('intro').textContent=T.intro;$('pdfLabel').textContent=T.pdf;$('appLabel').textContent=T.app;$('functionsTitle').textContent=T.functionsTitle;$('functionsNote').textContent=T.functionsNote;$('kpiTitle').textContent=T.kpiTitle;$('kpiNote').textContent=T.kpiNote;$('contactTitle').textContent=T.contactTitle;$('brandFooterTitle').textContent=T.brandFooterTitle;$('creatorText').textContent=T.creatorText;$('legalText').textContent=T.legal;$('quickNav').innerHTML=`<a href="#functions">${T.quickFunctions}</a><a href="#kpi-section">${T.quickKpis}</a><a href="#contact-section">${T.quickContact}</a>`;
const cards=[['track','◉',T.track,T.trackD,'timer'],['pain','↕',T.pain,T.painD,'slider'],['events','＋',T.events,T.eventsD,'events'],['history','☷',T.history,T.historyD,'history'],['summary','▥',T.summary,T.summaryD,'chart'],['trend','↗',T.trend,T.trendD,'chart'],['reports','⤴',T.reports,T.reportsD,'report'],['sessions','▣',T.sessions,T.sessionsD,'backup'],['themes','Aa',T.themes,T.themesD,'theme'],['privacy','⌂',T.privacy,T.privacyD,'privacy']];const mini=k=>k==='timer'?'<div class="mini mini-timer"><div><b>START / STOP</b><br><span>00:48</span></div><div class="mini-orb">◉</div></div>':k==='slider'?'<div class="mini"><div class="mini-slider"></div><div style="display:flex;justify-content:space-between"><span>0</span><b>7/10</b><span>10</span></div></div>':k==='history'?'<div class="mini mini-history"><span><b>21:58</b><span>◉</span><b>39s · 8/10</b></span><span><b>21:59</b><span>⚡</span><b>Event</b></span></div>':k==='chart'?'<div class="mini"><div class="mini-chart"><i class="bar b1"></i><i class="bar b2"></i><i class="bar b3"></i><i class="bar b4"></i><i class="line"></i><i class="dot d1"></i><i class="dot d2"></i><i class="dot d3"></i></div></div>':k==='events'?'<div class="mini" style="display:flex;justify-content:space-around;font-size:22px"><span>🚻</span><span>⚡</span><span>💧</span><span>●</span><span>📷</span></div>':k==='report'?'<div class="mini">HTML · PNG · 📤</div>':k==='backup'?'<div class="mini">💾 Backup · Archive · Restore</div>':k==='theme'?'<div class="mini" style="display:flex;gap:6px"><i style="width:28px;height:28px;border-radius:9px;background:#7b2f0e"></i><i style="width:28px;height:28px;border-radius:9px;background:#365944"></i><i style="width:28px;height:28px;border-radius:9px;background:#60304e"></i><i style="width:28px;height:28px;border-radius:9px;background:#101217"></i></div>':'<div class="mini">Local · Offline-first · 🔒</div>';$('manualGrid').innerHTML=cards.map(c=>`<article class="card" id="${c[0]}"><div class="card-head"><div class="icon">${c[1]}</div><div><h2>${c[2]}</h2></div></div>${mini(c[4])}<p>${c[3]}</p></article>`).join('');$('kpis').innerHTML=[[T.kDuration,T.duration],[T.kInterval,T.interval],[T.kAvgD,T.avgD],[T.kAvgI,T.avgI],[T.kPain,T.painK]].map(([h,d])=>`<div class="kpi"><b>${h}</b>${d}</div>`).join('');$('printBtn').onclick=()=>window.print();$('backBtn').onclick=()=>{if(history.length>1)history.back();else location.href='./'};
</script>
