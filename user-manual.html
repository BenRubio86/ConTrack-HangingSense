<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ConTrack User Manual</title><style>:root{--bg:#fff6ea;--surface:#fffdf8;--text:#2c160c;--muted:#715649;--primary:#7b2f0e;--accent:#f39a32;--line:rgba(81,39,15,.16)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.page{max-width:920px;margin:auto;padding:24px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{max-width:360px;width:55%;height:auto}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{border:1px solid var(--line);background:var(--surface);padding:10px 14px;border-radius:999px;font-weight:800}.hero{margin:24px 0;padding:24px;border-radius:24px;background:var(--surface);border:1px solid var(--line)}h1{font-size:42px;margin:0 0 6px}h2{margin-top:28px}.sub{color:var(--muted);line-height:1.55}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px}.visual{height:120px;border-radius:18px;background:linear-gradient(145deg,var(--surface),color-mix(in srgb,var(--accent) 18%,var(--surface)));display:grid;place-items:center;font-size:46px;margin-bottom:12px}.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pill{padding:10px;border-radius:14px;background:color-mix(in srgb,var(--accent) 12%,var(--surface));font-weight:700}.contact{display:grid;gap:6px}.creator{margin-top:30px;padding-top:16px;border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;color:var(--muted)}.creator img{width:54px;height:54px;border-radius:14px}.creator b{color:var(--text)}@media(max-width:680px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.brand{width:100%;max-width:440px}}@media print{.actions{display:none}.page{max-width:none;padding:10mm}.card,.hero{break-inside:avoid}body{background:#fff}}</style></head><body><main class="page"><div class="top"><img class="brand" src="brand-lockup.png" alt="ConTrack by Hanging Sense"><div class="actions"><button id="printBtn">🖨️ PDF</button><button onclick="history.back()">← App</button></div></div><section class="hero"><h1 id="title">User manual</h1><p class="sub" id="intro"></p></section><div class="grid" id="manualGrid"></div><section class="card"><h2 id="kpiTitle"></h2><div class="kpi" id="kpis"></div></section><section class="card"><h2 id="contactTitle"></h2><div class="contact"><div>💬 <b>WeChat-ID:</b> HangingSense</div><div>✈️ <b>Telegram-ID:</b> HangingSense</div><div>📸 <b>Instagram:</b> @hangingsense</div><div>✉️ <b>Email:</b> hangingsense@gmail.com</div></div></section><div class="creator"><img src="creator-benyima-ai.png" alt="BenYimaAI"><div><b>BenYimaAI</b><br><span id="creatorText"></span></div></div></main><script>const q=new URLSearchParams(location.search),lang=q.get('lang')||'en',theme=q.get('theme')||'hanging';const themes={hanging:['#fff6ea','#fffdf8','#2c160c','#715649','#7b2f0e','#f39a32'],terracotta:['#fff1e9','#fffaf6','#331610','#7c5048','#983f28','#ed8c65'],sage:['#f3f6ed','#fbfcf8','#17251c','#55675b','#365944','#c37432'],plum:['#f8f0f6','#fffafd','#2b1728','#70576d','#60304e','#d47a42'],night:['#101217','#1d2028','#fff5ea','#cbb9a8','#f0a45d','#ffb259'],ivory:['#fbf8f0','#fff','#1d1a17','#696158','#2f2923','#b97834']};const th=themes[theme]||themes.hanging;['--bg','--surface','--text','--muted','--primary','--accent'].forEach((k,i)=>document.documentElement.style.setProperty(k,th[i]));const EN={title:'ConTrack user manual',intro:'This guide explains the screens, KPIs, charts, events, photos, reports, backups and privacy model. Use the PDF button to print or save this page as a PDF.',track:'Track',trackD:'Tap START at the beginning of a contraction and STOP at the end. The latest five contractions show duration and pain intensity. Edit the latest record directly from Track.',pain:'Pain intensity',painD:'After a contraction ends, use the 0–10 slider. The value is subjective and can be edited later.',events:'Events & photos',eventsD:'Record pee, pain/discomfort, waters/fluid, bleeding or another event. Add a note and optional photo. Photos stay locally in IndexedDB unless you explicitly share or export them.',history:'History',historyD:'History combines contractions and events. Each record uses two rows: timestamp and KPIs first, then rolling averages, notes, photos and Edit.',summary:'Summary',summaryD:'The unified chart combines contraction duration, start-to-start interval, pain intensity and event markers. Choose 1 h, 3 h, Day or All. The X-axis shows the relevant time scale and date context.',trend:'Rolling trend',trendD:'The second chart shows rolling averages for duration and interval. Each point uses up to the latest five available values.',reports:'Share & export',reportsD:'Share creates a self-contained HTML report in the currently selected theme and language. Download offers PNG or HTML. Reports include charts, timeline, photos, brand logo and creator credit.',sessions:'Sessions & backup',sessionsD:'Before a new session, ConTrack offers backup or in-app archive. Backup includes locally stored event photos.',themes:'Themes & language',themesD:'Six themes change the app, charts and reports. Language selection also changes chart labels and export text.',privacy:'Privacy',privacyD:'ConTrack is local/offline-first. No account or cloud sync is required. Timing data alone does not diagnose labour.',kpiTitle:'KPI definitions',duration:'Duration = start to end of a contraction.',interval:'Interval = start of one contraction to start of the next.',avgD:'Avg duration · last 5 = mean of the latest up to five duration values.',avgI:'Avg interval · last 5 = mean of the latest up to five interval values.',painK:'Pain intensity = optional subjective 0–10 value.',contactTitle:'Contact Hanging Sense',creatorText:'App creator · product concept, UX direction and application development.'};const DE={title:'ConTrack Bedienungsanleitung',intro:'Diese Anleitung erklärt Bildschirme, KPIs, Diagramme, Ereignisse, Fotos, Berichte, Sicherungen und Datenschutz. Über PDF kann diese Seite gedruckt oder als PDF gespeichert werden.',track:'Track / Wehentimer',trackD:'START beim Beginn einer Wehe und STOP beim Ende tippen. Die letzten fünf Wehen zeigen Dauer und Schmerzintensität. Der letzte Eintrag kann direkt auf Track bearbeitet werden.',pain:'Schmerzintensität',painD:'Nach dem Ende einer Wehe den 0–10-Slider verwenden. Der Wert ist subjektiv und kann später bearbeitet werden.',events:'Ereignisse & Fotos',eventsD:'Toilette, Schmerz/Unwohlsein, Fruchtwasser/Flüssigkeit, Blutung oder anderes erfassen. Notiz und optionales Foto ergänzen. Fotos bleiben lokal in IndexedDB, bis sie aktiv geteilt oder exportiert werden.',history:'Verlauf',historyD:'Der Verlauf kombiniert Wehen und Ereignisse. Jeder Datensatz nutzt zwei Zeilen: Zeitstempel und KPIs oben, darunter Mittelwerte, Notizen, Foto und Bearbeiten.',summary:'Übersicht',summaryD:'Das kombinierte Diagramm zeigt Wehendauer, Start-zu-Start-Intervall, Schmerzintensität und Ereignismarker. 1 h, 3 h, Tag oder Alle wählen. Die X-Achse zeigt Zeit und Datumskontext.',trend:'Trend der letzten 5 Werte',trendD:'Das zweite Diagramm zeigt gleitende Mittelwerte für Dauer und Intervall. Jeder Punkt nutzt bis zu fünf zuletzt verfügbare Werte.',reports:'Teilen & Export',reportsD:'Teilen erzeugt einen eigenständigen HTML-Bericht im aktuell gewählten Design und in der gewählten Sprache. Download bietet PNG oder HTML. Berichte enthalten Charts, Zeitleiste, Fotos, Brand-Logo und Creator.',sessions:'Sitzungen & Sicherung',sessionsD:'Vor einer neuen Sitzung bietet ConTrack Sicherung oder Archivierung in der App an. Die Sicherung umfasst lokal gespeicherte Ereignisfotos.',themes:'Designs & Sprache',themesD:'Sechs Designs verändern App, Diagramme und Berichte. Die Sprachauswahl verändert außerdem Diagrammtexte und Exporttexte.',privacy:'Datenschutz',privacyD:'ConTrack arbeitet lokal/offline-first. Kein Konto oder Cloud-Sync ist erforderlich. Zeitdaten allein diagnostizieren keine Geburt.',kpiTitle:'KPI-Definitionen',duration:'Dauer = Beginn bis Ende einer Wehe.',interval:'Intervall = Beginn einer Wehe bis Beginn der nächsten.',avgD:'Ø Dauer · letzte 5 = Mittelwert der bis zu fünf letzten Dauerwerte.',avgI:'Ø Intervall · letzte 5 = Mittelwert der bis zu fünf letzten Intervallwerte.',painK:'Schmerzintensität = optionaler subjektiver Wert 0–10.',contactTitle:'Kontakt Hanging Sense',creatorText:'App Creator · Produktkonzept, UX-Richtung und Anwendungsentwicklung.'};const minimal={fr:{title:'Mode d’emploi ConTrack',track:'Suivi',history:'Historique',summary:'Résumé',themes:'Thèmes & langue',kpiTitle:'Définitions KPI',contactTitle:'Contact Hanging Sense'},es:{title:'Manual de ConTrack',track:'Seguimiento',history:'Historial',summary:'Resumen',themes:'Temas e idioma',kpiTitle:'Definiciones KPI',contactTitle:'Contacto Hanging Sense'},fa:{title:'راهنمای ConTrack',track:'ردیابی',history:'تاریخچه',summary:'خلاصه',themes:'پوسته و زبان',kpiTitle:'تعریف شاخص‌ها',contactTitle:'تماس با Hanging Sense'},zh:{title:'ConTrack 使用说明',track:'记录',history:'历史',summary:'总结',themes:'主题与语言',kpiTitle:'KPI 定义',contactTitle:'联系 Hanging Sense'},hi:{title:'ConTrack उपयोग निर्देश',track:'ट्रैक',history:'इतिहास',summary:'सारांश',themes:'थीम और भाषा',kpiTitle:'KPI परिभाषाएँ',contactTitle:'Hanging Sense संपर्क'},ar:{title:'دليل ConTrack',track:'التتبع',history:'السجل',summary:'الملخص',themes:'السمات واللغة',kpiTitle:'تعريف المؤشرات',contactTitle:'تواصل Hanging Sense'},ru:{title:'Инструкция ConTrack',track:'Трекер',history:'История',summary:'Сводка',themes:'Темы и язык',kpiTitle:'Определения KPI',contactTitle:'Контакты Hanging Sense'},ko:{title:'ConTrack 사용 설명서',track:'추적',history:'기록',summary:'요약',themes:'테마 및 언어',kpiTitle:'KPI 정의',contactTitle:'Hanging Sense 연락처'},ja:{title:'ConTrack 取扱説明',track:'記録',history:'履歴',summary:'概要',themes:'テーマと言語',kpiTitle:'KPI 定義',contactTitle:'Hanging Sense 連絡先'}};const T=lang==='de'?DE:{...EN,...(minimal[lang]||{})};document.documentElement.lang=lang;document.documentElement.dir=['ar','fa'].includes(lang)?'rtl':'ltr';document.getElementById('title').textContent=T.title;document.getElementById('intro').textContent=T.intro;const cards=[['◉',T.track,T.trackD],['↕',T.pain,T.painD],['＋',T.events,T.eventsD],['☷',T.history,T.historyD],['▥',T.summary,T.summaryD],['↗',T.trend,T.trendD],['⤴',T.reports,T.reportsD],['▣',T.sessions,T.sessionsD],['Aa',T.themes,T.themesD],['⌂',T.privacy,T.privacyD]];document.getElementById('manualGrid').innerHTML=cards.map(c=>`<section class="card"><div class="visual">${c[0]}</div><h2>${c[1]}</h2><p class="sub">${c[2]}</p></section>`).join('');document.getElementById('kpiTitle').textContent=T.kpiTitle;document.getElementById('kpis').innerHTML=[T.duration,T.interval,T.avgD,T.avgI,T.painK].map(x=>`<div class="pill">${x}</div>`).join('');document.getElementById('contactTitle').textContent=T.contactTitle;document.getElementById('creatorText').textContent=T.creatorText;document.getElementById('printBtn').onclick=()=>window.print();</script></body></html>
